name: Build Eglantine Windows

on:
  workflow_dispatch:
  push:
    branches:
      - nx2

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Descargar Eglantine
        uses: actions/checkout@v4
        with:
          ref: nx2
          submodules: recursive
          fetch-depth: 0

      - name: Instalar Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts

      - name: Instalar Vulkan SDK
        shell: pwsh
        run: |
          winget install --id LunarG.VulkanSDK --silent --accept-package-agreements --accept-source-agreements

      - name: Configurar CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar Eglantine
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2

      - name: Guardar ejecutables
        uses: actions/upload-artifact@v4
        with:
          name: Eglantine-Windows-x64
          path: |
            build/**/eden.exe
            build/**/Eglantine.exe
            build/bin/*.dll
          if-no-files-found: warn
          retention-days: 7
